spring.application.name=neighborcare
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:neighborcare}
spring.datasource.username=${DB_USER:neighborcare}
spring.datasource.password=${DB_PASSWORD:neighborcare_local}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
