name: Pianificatore

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

jobs:
  fase:
    if: ${{ github.repository == 'Team-C01/NeighborCare' && github.event.sender.type == 'User' && (github.event.label.name == 'fase:piano' && contains(github.event.issue.labels.*.name, 'task-agente')) }}
    uses: ./.github/workflows/esegui-fase.yml
    with:
      phase: piano
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
