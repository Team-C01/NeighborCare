name: CI

on:
  workflow_dispatch:
  push:
    branches: ['**']
  # Final check on the actual PR merge ref, triggered by the human review.
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  repository-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      backend: ${{ steps.report.outputs.backend }}
      frontend: ${{ steps.report.outputs.frontend }}
      backend_failed: ${{ steps.report.outputs.backend_failed }}
      frontend_failed: ${{ steps.report.outputs.frontend_failed }}
      sonar: ${{ steps.sonar.outcome }}
      database: ${{ steps.verify.outputs.database }}
      backend_build: ${{ steps.verify.outputs.backend }}
      frontend_build: ${{ steps.verify.outputs.frontend_build }}
      frontend_tests: ${{ steps.verify.outputs.frontend_tests }}
      audit: ${{ steps.verify.outputs.audit }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Diff senza errori di whitespace
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: git diff --check "origin/${BASE_REF}...HEAD"
      - name: Sintassi YAML e collegamenti Markdown locali
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; Dir.glob("{.github,docs}/**/*.{yml,yaml}", File::FNM_DOTMATCH).each { |f| YAML.parse_file(f); puts "YAML OK: #{f}" }'
          python3 - <<'PY'
          from pathlib import Path
          import re
          from urllib.parse import unquote
          errors = []
          for file in [Path("README.md"), Path("AGENTS.md"), *Path("docs").rglob("*.md")]:
              text = file.read_text(encoding="utf-8")
              for value in re.findall(r"(?<!!)\[[^\]]*\]\(([^)]+)\)", text):
                  dest = unquote(value.split("#", 1)[0].strip())
                  if not dest or "://" in dest or dest.startswith(("mailto:", "#")):
                      continue
                  if not (file.parent / dest).exists():
                      errors.append(f"{file}: link non valido -> {dest}")
          if errors:
              raise SystemExit("\n".join(errors))
          print("OK: link Markdown locali verificati")
          PY
      - name: Segnala modifiche a test gia esistenti
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            case "$file" in
              backend/src/test/*|frontend/tests/*|frontend/src/*.test.*|frontend/src/*.spec.*)
                if git cat-file -e "origin/${BASE_REF}:$file" 2>/dev/null; then
                  echo "Test esistente aggiornato: $file (verificare le asserzioni durante la review)."
                fi ;;
            esac
          done < <(git diff --name-only "origin/${BASE_REF}...HEAD")
      - name: Test della logica dei workflow
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
          bash -n .github/scripts/verify-project.sh
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version-file: backend/.java-version
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build, PostgreSQL, test e audit
        id: verify
        run: bash .github/scripts/verify-project.sh
      - name: Riepilogo test (anche in caso di errore)
        id: report
        if: always() && !cancelled()
        run: |
          if [[ -f .github/scripts/verify_reports.py ]]; then
            python3 .github/scripts/verify_reports.py --summary || true
          else
            echo "Report non disponibile: checkout o preparazione falliti." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Sonar Cloud Free supports main and PRs targeting main, not arbitrary branches.
      - name: Seleziona analisi SonarQube Cloud
        id: sonar_context
        if: success() && vars.SONAR_PROJECT_KEY != '' && vars.SONAR_ORGANIZATION != '' && (github.event_name != 'pull_request_review' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$BRANCH" == main ]]; then
            echo "scan=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          prs=$(gh api --method GET "repos/$REPO/pulls" -f state=open -f base=main -f "head=${REPO%%/*}:$BRANCH")
          pr=$(jq -r --arg sha "$HEAD_SHA" --arg repo "$REPO" '.[] | select(.head.sha == $sha and .head.repo.full_name == $repo) | .number' <<< "$prs" | head -n 1)
          [[ -n "$pr" ]] || exit 0
          # Analyze the real PR head, not the synthetic merge commit.
          if [[ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]]; then
            git checkout --detach "$HEAD_SHA"
            mvn -B -f backend/pom.xml -DskipTests clean compile
          fi
          printf 'scan=true\npr=%s\nbranch=%s\n' "$pr" "$BRANCH" >> "$GITHUB_OUTPUT"
      - name: SonarQube Cloud - main
        id: sonar_main
        if: steps.sonar_context.outputs.scan == 'true' && steps.sonar_context.outputs.pr == ''
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
      - name: SonarQube Cloud - PR
        id: sonar
        if: steps.sonar_context.outputs.scan == 'true' && steps.sonar_context.outputs.pr != ''
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.pullrequest.key=${{ steps.sonar_context.outputs.pr }}
            -Dsonar.pullrequest.branch=${{ steps.sonar_context.outputs.branch }}
            -Dsonar.pullrequest.base=main

  report-pr:
    needs: repository-checks
    if: always() && !cancelled() && github.repository == 'Team-C01/NeighborCare' && (github.event_name != 'pull_request_review' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Aggiorna unico riepilogo CI sulla PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHECK_RESULT: ${{ needs.repository-checks.result }}
          BACKEND: ${{ needs.repository-checks.outputs.backend }}
          FRONTEND: ${{ needs.repository-checks.outputs.frontend }}
          BACKEND_FAILED: ${{ needs.repository-checks.outputs.backend_failed }}
          FRONTEND_FAILED: ${{ needs.repository-checks.outputs.frontend_failed }}
          SONAR: ${{ needs.repository-checks.outputs.sonar }}
          DATABASE: ${{ needs.repository-checks.outputs.database }}
          BACKEND_BUILD: ${{ needs.repository-checks.outputs.backend_build }}
          FRONTEND_BUILD: ${{ needs.repository-checks.outputs.frontend_build }}
          FRONTEND_TESTS: ${{ needs.repository-checks.outputs.frontend_tests }}
          AUDIT: ${{ needs.repository-checks.outputs.audit }}
        run: |
          set -euo pipefail
          # No checkout or execution of application code in this write-enabled job.
          prs=$(gh api --method GET "repos/$REPO/pulls" -f state=open -f base=main -f "head=${REPO%%/*}:$BRANCH")
          pr=$(jq -r --arg sha "$HEAD_SHA" --arg repo "$REPO" '.[] | select(.head.sha == $sha and .head.repo.full_name == $repo) | .number' <<< "$prs" | head -n 1)
          [[ -n "$pr" ]] || exit 0
          safe_counts() {
            if [[ "$1" =~ ^[0-9]+\ superati,\ [0-9]+\ falliti/errori,\ [0-9]+\ saltati$ ]]; then
              printf '%s' "$1"
            else
              printf 'Non disponibile'
            fi
          }
          safe_status() {
            case "$1" in success|failure|skipped|cancelled) printf '%s' "$1";; *) printf 'non eseguito';; esac
          }
          safe_names() {
            if [[ -n "$1" && "${#1}" -le 2000 ]]; then
              printf '%s' "$1" | tr -d '\r\n'
            else
              printf 'Nessuno riportato'
            fi
          }
          marker='<!-- neighborcare-ci-summary -->'
          body=$(printf '%s\n## CI NeighborCare - %s\n\nCommit: `%s`\n\n- PostgreSQL: %s\n- Maven (build/test): %s\n- Backend: %s\n- Build frontend: %s\n- Vitest: %s\n- Frontend: %s\n- Audit npm: %s\n- Test backend falliti: %s\n- Test frontend falliti: %s\n- Analisi SonarQube: %s\n\n[Dettagli e report](https://github.com/%s/actions/runs/%s). I test manuali restano da documentare.\n' \
            "$marker" "$(safe_status "$CHECK_RESULT")" "$HEAD_SHA" "$(safe_status "$DATABASE")" "$(safe_status "$BACKEND_BUILD")" "$(safe_counts "$BACKEND")" "$(safe_status "$FRONTEND_BUILD")" "$(safe_status "$FRONTEND_TESTS")" "$(safe_counts "$FRONTEND")" "$(safe_status "$AUDIT")" "$(safe_names "$BACKEND_FAILED")" "$(safe_names "$FRONTEND_FAILED")" "$(safe_status "$SONAR")" "$REPO" "$GITHUB_RUN_ID")
          comment=$(gh api --paginate "repos/$REPO/issues/$pr/comments?per_page=100" --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- neighborcare-ci-summary -->"))) | .id' | tail -n 1)
          [[ "$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha)" == "$HEAD_SHA" ]] || exit 0
          if [[ -n "$comment" ]]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$comment" -f "body=$body" > /dev/null
          else
            gh api --method POST "repos/$REPO/issues/$pr/comments" -f "body=$body" > /dev/null
          fi
