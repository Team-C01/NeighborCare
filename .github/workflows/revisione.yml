name: Revisore

on:
  pull_request_target:
    types: [opened, ready_for_review, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR interna da revisionare (invocata dal runner)
        required: true
        type: string
      head_sha:
        description: Commit da revisionare
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  fase:
    if: ${{ github.repository == 'Team-C01/NeighborCare' && (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request_target' && github.event.sender.type == 'User' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'main') }}
    uses: ./.github/workflows/esegui-fase.yml
    with:
      phase: revisione
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
