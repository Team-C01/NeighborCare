name: Governance PR

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

jobs:
  governance-gate:
    name: governance-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verifica PM, Tester e Revisore sul commit corrente
        uses: actions/github-script@v7
        env:
          SECOND_PM_LOGIN: ${{ vars.NEIGHBORCARE_SECOND_PM_LOGIN }}
        with:
          script: |
            // Check deterministico: nessuna chiamata AI e nessuna modifica ai file.
            // Il Ruleset deve richiedere esplicitamente "governance-gate".
            const prNumber = context.payload.pull_request?.number;
            if (!prNumber) { core.setFailed('Evento privo di Pull Request.'); return; }
            const {data: pr} = await github.rest.pulls.get({
              ...context.repo, pull_number: prNumber
            });
            const sha = pr.head.sha;
            const problems = [];
            if (pr.state !== 'open' || pr.draft) {
              problems.push('La PR deve essere aperta e Ready for review.');
            }
            if (pr.base.ref !== 'main' ||
                pr.head.repo?.full_name !== context.repo.owner + '/' + context.repo.repo) {
              problems.push('Il gate supporta soltanto PR interne verso main.');
            }
            const {data: files} = await github.rest.pulls.listFiles({
              ...context.repo, pull_number: prNumber, per_page: 100
            });
            if (!files.length || files.length > 80) {
              problems.push('Diff vuota o maggiore di 80 file.');
            }
            const docsOnly = files.length > 0 && files.every(f => {
              const path = f.filename;
              return !path.endsWith('.pdf') &&
                (path === 'README.md' || path === 'AGENTS.md' ||
                 path === '.gitignore' || path.startsWith('.github/') ||
                 path.startsWith('docs/'));
            });

            // Eccezione SOLO per il primo bootstrap di un modulo vuoto:
            // richiede Reviewer AI, PM umano e CI; Tester applicativo N/A.
            let bootstrap = !docsOnly && files.length > 0 &&
              files.every(f => f.filename.startsWith('frontend/') ||
                               f.filename.startsWith('backend/'));
            if (bootstrap) {
              const roots = [...new Set(files.map(f => f.filename.split('/')[0]))];
              for (const root of roots) {
                const manifest = root === 'frontend' ? 'frontend/package.json' : 'backend/pom.xml';
                if (!files.some(f => f.filename === manifest && f.status === 'added')) {
                  bootstrap = false; break;
                }
                try {
                  await github.rest.repos.getContent({
                    ...context.repo, path: manifest, ref: pr.base.sha
                  });
                  bootstrap = false; break;
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }
            }

            const linkedIssue = (pr.body || '').match(/\b(?:Closes|Fixes)\s+#(\d+)\b/i);
            if (!docsOnly && !linkedIssue) {
              problems.push('La PR applicativa deve collegare la Issue con Closes #N o Fixes #N.');
            }
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: prNumber, per_page: 100
            });
            const aiReport = comments.find(c =>
              c.user?.login === 'github-actions[bot]' &&
              (c.body || '').startsWith('## Revisione AI — PR #' + prNumber) &&
              (c.body || '').includes('Commit esaminato: ' + sha)
            );
            if (!aiReport) {
              problems.push('Manca il report del Revisore AI sul commit ' + sha.slice(0, 12) + '.');
            }

            const testerReport = comments.find(c => {
              if (c.user?.login !== 'github-actions[bot]') return false;
              const body = c.body || '';
              return (body.startsWith('## Tester indipendente — verifica documentale') &&
                        body.includes('Commit esaminato: ' + sha)) ||
                     (body.startsWith('## Tester indipendente — PR #' + prNumber) &&
                        body.includes('Commit dopo il test: ' + sha) &&
                        /Risultato dei test automatici \(exit code\):\s*0\b/.test(body));
            });
            if (!testerReport && !bootstrap) {
              problems.push('Manca il Tester riuscito e riferito al commit corrente.');
            }
            if (bootstrap) {
              core.notice('Primo bootstrap: Tester applicativo N/A; verificare build e test reali nella CI.');
            }

            const {data: workflowResult} = await github.rest.actions.listWorkflowRunsForRepo({
              ...context.repo, branch: pr.head.ref, event: 'pull_request', per_page: 100
            });
            const runs = workflowResult.workflow_runs || [];
            const reviewerRun = runs.find(r =>
              r.name === 'Revisore' && r.head_sha === sha &&
              r.status === 'completed' && r.conclusion === 'success'
            );
            if (!reviewerRun) {
              problems.push('Non risulta una run Revisore riuscita sul commit corrente.');
            }
            if (!bootstrap && testerReport) {
              const testerRun = runs.find(r =>
                r.name === 'Tester indipendente' &&
                r.status === 'completed' && r.conclusion === 'success' &&
                Date.parse(r.updated_at) >= Date.parse(testerReport.created_at)
              );
              if (!testerRun) {
                problems.push('Non risulta una run Tester riuscita per il report del commit corrente.');
              }
            }

            const {data: reviewList} = await github.rest.pulls.listReviews({
              ...context.repo, pull_number: prNumber, per_page: 100
            });
            const pmLogins = [
              'antonio-caiazzo',
              (process.env.SECOND_PM_LOGIN || '').trim().toLowerCase()
            ].filter(Boolean);
            const lastByReviewer = new Map();
            for (const review of reviewList) {
              const login = (review.user?.login || '').toLowerCase();
              if (login) lastByReviewer.set(login, review);
            }
            const pmApproved = pmLogins.some(login => {
              const review = lastByReviewer.get(login);
              return login !== (pr.user?.login || '').toLowerCase() &&
                review?.state === 'APPROVED' && review?.commit_id === sha;
            });
            if (!pmApproved) {
              problems.push('Serve una review GitHub APPROVED di un PM diverso dall’autore, sullo SHA corrente.');
            }

            if (problems.length) {
              core.setFailed(problems.map(s => '- ' + s).join('\n'));
              return;
            }
            core.notice('Gate superato: PM, Tester (se applicabile), Revisore e SHA verificati. Verificare anche repository-checks e Code Owner review nel Ruleset.');
