name: Governance PR

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

jobs:
  governance-gate:
    name: governance-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verifica TM responsabile, Tester, Revisore e review indipendente sul commit corrente
        uses: actions/github-script@v7
        env:
          SECOND_PM_LOGIN: ${{ vars.NEIGHBORCARE_SECOND_PM_LOGIN }}
        with:
          script: |
            const prNumber=context.payload.pull_request?.number;
            if (!prNumber) { core.setFailed('Evento senza Pull Request.'); return; }
            const {data:pr}=await github.rest.pulls.get({...context.repo,pull_number:prNumber});
            const sha=pr.head.sha;
            const pmLogins=['antonio-caiazzo',(process.env.SECOND_PM_LOGIN||'').toLowerCase()].filter(Boolean);
            const problems=[];
            if (pr.state!=='open' || pr.draft) problems.push('La PR deve essere aperta e Ready for review.');
            if (pr.base.ref!=='main' || pr.head.repo?.full_name!==context.repo.owner+'/'+context.repo.repo)
              problems.push('La PR deve essere interna e destinata a main.');

            const linked=(pr.body||'').match(/\b(?:Closes|Fixes)\s+#(\d+)\b/i);
            const frozen=(pr.body||'').match(/^TM responsabile: @([A-Za-z0-9-]+)$/m)?.[1]?.toLowerCase();
            let responsible='';
            if (linked && frozen) {
              const {data:issue}=await github.rest.issues.get({...context.repo,issue_number:Number(linked[1])});
              if (issue.state!=='open' || issue.assignees.length!==1) {
                problems.push('Issue originale chiusa o senza un solo TM assegnato.');
              } else {
                responsible=issue.assignees[0].login.toLowerCase();
                if (responsible!==frozen) problems.push('Il TM assegnato non coincide con il responsabile registrato nella PR.');
              }
            }
            const files=await github.paginate(github.rest.pulls.listFiles,{...context.repo,pull_number:prNumber,per_page:100});
            if (!files.length || files.length>80) problems.push('Diff vuota o superiore a 80 file.');
            const paths=files.map(f=>f.filename);
            const protectedPath=p=>p==='AGENTS.md'||p==='README.md'||p==='.gitignore'||
              p.startsWith('.github/')||p==='docs/agentic-workflow-iterazioni.md';
            const needsPm=paths.some(protectedPath);
            const needsTm=paths.some(p=>!protectedPath(p));
            // Administrative governance PR: opened by a PM, only protected files,
            // requires approval by the OTHER PM; never grants exemption to application PRs.
            const manualGovernance=paths.length>0 && paths.every(protectedPath) &&
              pmLogins.includes((pr.user?.login||'').toLowerCase()) &&
              !linked && !frozen && !pr.head.ref.startsWith('agent/issue-');
            if (manualGovernance) {
              const {data:manualReviews}=await github.rest.pulls.listReviews({
                ...context.repo,pull_number:prNumber,per_page:100
              });
              const latestReview=new Map();
              for (const rev of manualReviews) latestReview.set((rev.user?.login||'').toLowerCase(),rev);
              const independentPm=pmLogins.some(login=>{
                const rev=latestReview.get(login);
                return login!==(pr.user?.login||'').toLowerCase() &&
                  rev?.state==='APPROVED' && rev.commit_id===sha;
              });
              if (!independentPm) problems.push('Governance manuale: serve APPROVED dell altro PM sullo SHA attuale.');
              if (problems.length) { core.setFailed(problems.map(p=>'- '+p).join('\n')); return; }
              core.notice('PR di governance: approvata dal secondo PM. CI e Code Owner review restano richiesti dal Ruleset.');
              return;
            }
            if (!linked || !frozen) problems.push('Mancano Closes #Issue o TM responsabile nella PR.');
            const comments=await github.paginate(github.rest.issues.listComments,{...context.repo,issue_number:prNumber,per_page:100});

            const testerReport=comments.filter(c=>{
              if (c.user?.login!=='github-actions[bot]') return false;
              const b=c.body||'';
              return (b.startsWith('## Tester indipendente — verifica documentale') &&
                      b.includes('Commit esaminato: '+sha)) ||
                     (b.startsWith('## Tester indipendente — PR #'+prNumber) &&
                      b.includes('Commit dopo il test: '+sha) &&
                      /Risultato dei test automatici \(exit code\):\s*0\b/.test(b));
            }).at(-1);
            if (!testerReport) {
              problems.push('Manca il report del Tester superato sul commit corrente.');
            } else {
              const id=(testerReport.body||'').match(/^Run Tester:\s*(\d+)\s*$/m)?.[1];
              if (!id) {
                problems.push('Report Tester privo di identificativo della run.');
              } else {
                try {
                  const {data:run}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:Number(id)});
                  if (run.name!=='Tester indipendente' || run.conclusion!=='success' ||
                      run.head_branch!==pr.head.ref)
                    problems.push('La run del Tester non e conclusa con successo sul branch della PR.');
                } catch (error) {
                  problems.push('Impossibile validare la run del Tester: '+error.message);
                }
              }
            }

            const reviewerReport=comments.filter(c=>c.user?.login==='github-actions[bot]' &&
              (c.body||'').startsWith('## Revisione AI — PR #'+prNumber) &&
              (c.body||'').includes('Commit esaminato: '+sha)).at(-1);
            if (!reviewerReport) {
              problems.push('Manca il report del Revisore AI sul commit corrente.');
            } else if (!/^ESITO_REVISIONE:\s*PASS\s*$/m.test(reviewerReport.body||'')) {
              problems.push('Il Revisore AI ha richiesto modifiche: tornare a Draft e correggere.');
            }
            const {data:workflowResult}=await github.rest.actions.listWorkflowRunsForRepo({
              ...context.repo,branch:pr.head.ref,event:'pull_request',per_page:100
            });
            const reviewerRun=(workflowResult.workflow_runs||[]).find(r=>
              r.name==='Revisore' && r.head_sha===sha &&
              r.status==='completed' && r.conclusion==='success'
            );
            if (!reviewerRun) problems.push('Manca una run Revisore riuscita sul commit corrente.');

            const {data:reviews}=await github.rest.pulls.listReviews({...context.repo,pull_number:prNumber,per_page:100});
            const latest=new Map();
            for (const review of reviews) {
              const login=(review.user?.login||'').toLowerCase();
              if (login) latest.set(login,review);
            }
            let independentTm=false,pmReview=false;
            for (const [login,review] of latest) {
              if (review.state!=='APPROVED' || review.commit_id!==sha ||
                  login===responsible || login==='github-actions[bot]' || login===(pr.user?.login||'').toLowerCase())
                continue;
              try {
                const {data:perm}=await github.rest.repos.getCollaboratorPermissionLevel({
                  ...context.repo,username:login
                });
                if (!['write','maintain','admin'].includes(perm.permission)) continue;
                if (pmLogins.includes(login)) pmReview=true;
                else independentTm=true;
              } catch (error) { core.warning('Permessi revisore non verificabili: '+login); }
            }
            if (needsTm && !independentTm)
              problems.push('Serve una review APPROVED di un TM diverso dal TM responsabile, sullo SHA corrente.');
            if (needsPm && !pmReview)
              problems.push('I file di governance richiedono una review APPROVED di un PM diverso dal responsabile.');
            if (problems.length) { core.setFailed(problems.map(p=>'- '+p).join('\n')); return; }
            core.notice('Gate superato: Tester, Revisore AI, review umana indipendente e SHA verificati. Restano obbligatori repository-checks e CODEOWNERS nel Ruleset.');
