name: Governance PR

on:
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  governance-gate:
    name: governance-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verifica approvazione umana indipendente sul commit corrente
        uses: actions/github-script@v9
        with:
          script: |
            const number=context.payload.pull_request.number;
            const {data:pr}=await github.rest.pulls.get({...context.repo,pull_number:number});
            if(pr.state!=='open'||pr.draft) {core.setFailed('PR aperta e Ready for review richiesta.');return;}
            const excluded=new Set([pr.user.login.toLowerCase()]);
            const linked=(pr.body||'').match(/^\s*(?:Closes|Fixes|Resolves|Refs)\s+#(\d+)\b/im);
            const branchIssue=pr.head.ref.match(/^agent\/issue-(\d+)(?:-implementazione)?$/);
            if(branchIssue && linked && branchIssue[1]!==linked[1]) {
              core.setFailed('Issue collegata non coerente con il branch del task.');return;
            }
            const issueNumber=Number(linked?.[1]||branchIssue?.[1]||0);
            if(issueNumber){
              const {data:issue}=await github.rest.issues.get({...context.repo,issue_number:issueNumber});
              for(const a of issue.assignees||[]) excluded.add(a.login.toLowerCase());
            }
            const responsible=(pr.body||'').match(/^Responsabili assegnati:\s*(.+)$/m)?.[1]||'';
            for(const login of responsible.matchAll(/@([a-zA-Z0-9-]+)/g)) excluded.add(login[1].toLowerCase());
            const approver=(pr.body||'').match(/^Autorizzante:\s*@([a-zA-Z0-9-]+)/m)?.[1];
            if(approver) excluded.add(approver.toLowerCase());
            const reviews=await github.paginate(github.rest.pulls.listReviews,{...context.repo,pull_number:number,per_page:100});
            const latest=new Map();
            for(const r of reviews){
              if(r.user&&['APPROVED','CHANGES_REQUESTED','DISMISSED'].includes(r.state)) latest.set(r.user.login.toLowerCase(),r);
            }
            for(const [login,r] of latest){
              if(excluded.has(login)||r.user.type!=='User'||r.state!=='APPROVED'||r.commit_id!==pr.head.sha) continue;
              const {data:access}=await github.rest.repos.getCollaboratorPermissionLevel({...context.repo,username:r.user.login});
              if(['write','maintain','admin'].includes(access.permission)){
                core.notice('Approvazione indipendente valida. CI e CODEOWNERS restano obbligatori; il report AI e consultivo.');
                return;
              }
            }
            core.setFailed('Serve una approvazione umana indipendente sul commit attuale (PM o TM non coinvolto nel task).');
