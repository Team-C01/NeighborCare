name: Implementatore

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  fase:
    if: ${{ github.repository == 'Team-C01/NeighborCare' && github.event.sender.type == 'User' && (github.event.label.name == 'fase:implementazione') }}
    uses: ./.github/workflows/esegui-fase.yml
    with:
      phase: implementazione
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
