name: Prepare coverage lock (temporary)
on:
  push:
    branches: [chore/coverage-and-review-report]
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
      - name: Generate exact matching Vitest coverage dependency lock
        working-directory: frontend
        run: |
          cp package-lock.json "$RUNNER_TEMP/old-lock.json"
          npm install --save-dev --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund @vitest/coverage-v8@5.1.2
          node --input-type=commonjs <<'JS'
          const fs = require('fs');
          const old = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/old-lock.json'));
          const next = JSON.parse(fs.readFileSync('package-lock.json'));
          for (const [k,v] of Object.entries(next.packages)) {
            if (JSON.stringify(old.packages[k]) !== JSON.stringify(v)) console.log('LOCK_DELTA ' + JSON.stringify([k,v]));
          }
          for (const k of Object.keys(old.packages)) if (!(k in next.packages)) console.log('LOCK_DELTA ' + JSON.stringify([k,null]));
          console.log('LOCK_DELTA_DONE');
          JS
